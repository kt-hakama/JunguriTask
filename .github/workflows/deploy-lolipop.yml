# https://junguritask.digitalsenior.jp/ へデプロイ（FTP）
#
# 必須 Secrets（名前は大文字小文字まで一致させる）:
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# 任意: FTP_SERVER_DIR

name: Deploy to Lolipop

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"

      - run: npm ci
      - run: npm run build

      - name: Upload dist via FTP
        # action.yml が node20 の間は GitHub が Node 24 で実行する旨の注釈が出る場合あり（上流対応待ち）
        uses: SamKirkland/FTP-Deploy-Action@v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          # ロリポップの「junguritask」用ドキュメントルートへの相対パス（FTP接続先からのパス）
          # 未設定のときは FTP ログイン直下にアップロードされます
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
