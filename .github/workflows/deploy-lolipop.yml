# https://junguritask.digitalsenior.jp/ へデプロイ（FTP）
# Secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, FTP_SERVER_DIR（任意）

name: Deploy to Lolipop

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci
      - run: npm run build

      - name: Upload dist via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          # ロリポップの「junguritask」用ドキュメントルートへの相対パス（FTP接続先からのパス）
          # 未設定のときは FTP ログイン直下にアップロードされます
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          dangerous-clean-slate: false
